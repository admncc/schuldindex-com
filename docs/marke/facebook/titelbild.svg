<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 924" width="1640" height="924">
  <!--
    Titelbild für die Facebook-Seite, 1640 × 924 (2 × 820 × 462).

    Das Format ist 16:9 - genau das, was Facebook auf dem Telefon zeigt
    (640 × 360), dort ist also alles zu sehen. Auf dem Schreibtisch werden
    820 × 312 gezeigt: oben und unten fallen je 150 Pixel weg, sichtbar bleibt
    y 150-774. Alles, was gelesen werden muss, liegt darin.

    Das Profilbild steht auf dem Schreibtisch unten links im Bild (etwa
    x 60-400, y 590-774) und auf dem Telefon unten mittig (etwa x 680-960,
    y 720-924). Beide Zonen bleiben frei von Text.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2733d4"/>
      <stop offset="1" stop-color="#6a3cea"/>
    </linearGradient>
    <linearGradient id="schein" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="weich" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .schrift { font-family: "Inter Display", Inter, system-ui, sans-serif; }
      .ui { font-family: Inter, system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1640" height="924" fill="url(#g)"/>
  <!-- ein weicher Lichtschein rechts, damit die Fläche nicht wie ein Farbfeld wirkt -->
  <ellipse cx="1420" cy="180" rx="520" ry="360" fill="#ffffff" opacity="0.10" filter="url(#weich)"/>

  <!-- Das Zeichen gross und blass, rechts angeschnitten: Wiedererkennung ohne Konkurrenz zum Text -->
  <g transform="translate(1180 150) scale(21)" opacity="0.13">
    <path d="M3.5 13.5 16 4l12.5 9.5" stroke="#ffffff" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="7" y="21" width="4.6" height="7" rx="1.6" fill="#ffffff"/>
    <rect x="13.7" y="18" width="4.6" height="10" rx="1.6" fill="#ffffff"/>
    <rect x="20.4" y="14.6" width="4.6" height="13.4" rx="1.6" fill="#ffffff"/>
  </g>

  <!-- Überschrift: derselbe Satz wie auf der Startseite -->
  <g class="schrift" fill="#ffffff">
    <text x="430" y="322" font-weight="800" font-size="104" letter-spacing="-3">Wie ist deine Schule</text>
    <text x="430" y="436" font-weight="800" font-size="104" letter-spacing="-3">wirklich?</text>
  </g>
  <!-- Unterstrich unter „wirklich?“ - als Betonung statt einer zweiten Farbe -->
  <path d="M434 462 C 620 446, 760 450, 890 458" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="9" stroke-linecap="round" fill="none"/>

  <text class="schrift" x="432" y="528" fill="#ffffff" fill-opacity="0.92" font-weight="500" font-size="40" letter-spacing="-0.5">
    Bewerte anonym. Niemand erfährt, dass du es warst.
  </text>

  <!-- Drei Pillen: die echten Bereiche des Fragebogens, so wie sie auf einem Schulprofil stehen -->
  <g class="ui" transform="translate(432 578)">
    <g>
      <rect width="262" height="68" rx="34" fill="#ffffff"/>
      <text x="28" y="43" font-size="26" font-weight="600" fill="#151a23">Sicherheit</text>
      <rect x="176" y="14" width="66" height="40" rx="20" fill="#e3f0e9"/>
      <text x="209" y="42" font-size="24" font-weight="700" fill="#1b6e45" text-anchor="middle">8,4</text>
    </g>
    <g transform="translate(280 0)">
      <rect width="262" height="68" rx="34" fill="#ffffff"/>
      <text x="28" y="43" font-size="26" font-weight="600" fill="#151a23">Unterricht</text>
      <rect x="176" y="14" width="66" height="40" rx="20" fill="#f7edd9"/>
      <text x="209" y="42" font-size="24" font-weight="700" fill="#8a5b06" text-anchor="middle">6,1</text>
    </g>
    <g transform="translate(560 0)">
      <rect width="282" height="68" rx="34" fill="#ffffff"/>
      <text x="28" y="43" font-size="26" font-weight="600" fill="#151a23">Ausstattung</text>
      <rect x="196" y="14" width="66" height="40" rx="20" fill="#f8e4e2"/>
      <text x="229" y="42" font-size="24" font-weight="700" fill="#a32820" text-anchor="middle">4,7</text>
    </g>
  </g>

  <!-- Adresse: rechts unten, innerhalb des sicheren Bereichs, weg vom Profilbild -->
  <text class="schrift" x="1456" y="748" text-anchor="end" fill="#ffffff" font-weight="700" font-size="40" letter-spacing="-1">schulindex.com</text>
</svg>
